name: MCP Registry

# Publishes server.json to the MCP Registry (registry.modelcontextprotocol.io) as
# io.github.arif-js/citepath. The Release workflow calls this after publishing to npm; it can also be
# run by hand to retry. The registry authenticates the workflow through GitHub OIDC, so no token is
# stored.
#
# The registry checks that the npm package version in server.json exists and declares a matching
# mcpName. npm can take a few minutes to serve a new version, so wait for it first.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # MCP Registry login

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Wait for the version to appear on npm
        run: |
          version="$(node -p "require('./server.json').version")"
          for attempt in $(seq 1 30); do
            if npm view "citepath@${version}" version > /dev/null 2>&1; then
              echo "citepath@${version} is available"
              exit 0
            fi
            echo "citepath@${version} not on npm yet (attempt ${attempt}/30)"
            sleep 20
          done
          echo "citepath@${version} did not appear on npm within 10 minutes"
          exit 1
      - name: Publish to the MCP Registry
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
