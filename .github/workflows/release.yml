name: Release

# Push a tag like v0.1.0 to build, test, and publish a GitHub Release with a
# packaged tarball and SHA-256 checksums. Nothing is published to npm.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Check the tag matches package.json
        run: |
          test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:e2e
      - run: npm run eval:fixtures
      - name: Package
        run: |
          npm pack
          sha256sum citepath-*.tgz > SHA256SUMS
          cat SHA256SUMS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" citepath-*.tgz SHA256SUMS --title "$GITHUB_REF_NAME" --generate-notes
