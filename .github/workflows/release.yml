name: Release

# Push a tag like v0.1.0 to build and test, publish the package to npm with
# provenance, and publish a GitHub Release with the same tarball, the MCPB
# bundles (citepath-<version>.mcpb for Claude Desktop, and
# citepath-<version>.smithery.mcpb for Smithery), and SHA-256 checksums.
#
# npm publishing uses trusted publishing (OIDC): npm trusts this workflow
# (arif-js/citepath, release.yml) as configured in the citepath package
# settings on npmjs.com, so no npm token is stored anywhere.
#
# Finally, the mcp-registry job publishes server.json to the MCP Registry (see mcp-registry.yml).
on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the GitHub Release
  id-token: write # npm trusted publishing, provenance, and MCP Registry login

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - name: Check the tag matches package.json
        run: |
          test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - name: Check server.json matches the tag
        run: |
          test "v$(node -p "require('./server.json').version")" = "${GITHUB_REF_NAME}"
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:e2e
      - run: npm run eval:fixtures
      - name: Package
        run: |
          npm pack
          npm run mcpb
          sha256sum citepath-*.tgz citepath-*.mcpb > SHA256SUMS
          cat SHA256SUMS
      - name: Publish to npm
        # Trusted publishing needs npm 11.5.1 or later.
        run: |
          npm install -g npm@^11.5.1
          npm --version
          npm publish citepath-*.tgz --provenance --access public
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" citepath-*.tgz citepath-*.mcpb SHA256SUMS --title "$GITHUB_REF_NAME" --generate-notes

  mcp-registry:
    needs: release
    uses: ./.github/workflows/mcp-registry.yml
